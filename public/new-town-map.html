<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>New Town Estate — Interactive Survey Map</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500;6..72,600;6..72,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif;background:#0a0a0a;color:#e5e5e5}
#map-root{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;background:#0a0a0a}
#map-root.dragging{cursor:grabbing}
#wrap{transform-origin:0 0;will-change:transform}
#wrap svg{display:block}
.plot-poly{cursor:pointer;transition:fill-opacity .12s,stroke-width .12s,filter .12s;vector-effect:non-scaling-stroke}
.plot-poly:hover{fill-opacity:.92!important;stroke-width:1.2!important;filter:brightness(1.2) drop-shadow(0 0 3px rgba(255,255,255,.15))}
.plot-poly.selected{stroke:#c9a84c!important;stroke-width:2!important;stroke-opacity:1!important;filter:drop-shadow(0 0 6px rgba(201,168,76,.4))!important;animation:plotPulse 2s ease infinite}
@keyframes plotPulse{0%,100%{filter:drop-shadow(0 0 6px rgba(201,168,76,.4))}50%{filter:drop-shadow(0 0 12px rgba(201,168,76,.6))}}
.block-label{font-family:'Newsreader',serif;font-weight:600;fill:rgba(255,255,255,.08);pointer-events:none;user-select:none}
#topbar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:linear-gradient(180deg,rgba(10,10,10,.98) 0%,rgba(10,10,10,.85) 65%,transparent 100%);pointer-events:none}
#topbar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:14px}
.brand-mark{width:42px;height:42px;border-radius:10px;background:linear-gradient(145deg,#c9a84c,#8a6d2f);display:flex;align-items:center;justify-content:center;font-family:'Newsreader',serif;font-weight:700;font-size:17px;color:#0a0a0a;box-shadow:0 2px 12px rgba(201,168,76,.25)}
.brand h1{font-family:'Newsreader',serif;font-size:20px;font-weight:600;color:#e8cc6e;line-height:1.1}
.brand .sub{font-size:9px;color:rgba(255,255,255,.28);letter-spacing:2.5px;text-transform:uppercase;margin-top:2px;font-family:'Inter',sans-serif}
.legend{display:flex;gap:2px;background:rgba(18,18,18,.94);border:1px solid rgba(255,255,255,.06);border-radius:26px;padding:4px 5px;backdrop-filter:blur(20px)}
.leg-chip{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:22px;font-size:11px;font-weight:500;color:rgba(255,255,255,.6);cursor:pointer;transition:all .12s}
.leg-chip:hover{background:rgba(255,255,255,.05)}
.leg-chip.active{background:rgba(255,255,255,.06)}
.leg-dot{width:10px;height:10px;border-radius:3px}
.leg-num{font-weight:700;color:#fff;font-variant-numeric:tabular-nums;margin-left:2px}
.search-wrap{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:55;display:flex;align-items:center;width:300px;background:rgba(18,18,18,.94);border:1px solid rgba(255,255,255,.08);border-radius:12px;backdrop-filter:blur(20px);overflow:hidden;transition:all .2s;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.search-wrap:focus-within{border-color:rgba(201,168,76,.3);box-shadow:0 4px 24px rgba(201,168,76,.1)}
.search-icon{padding:0 4px 0 14px;color:rgba(255,255,255,.25);display:flex;align-items:center}
.search-icon svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#search{flex:1;background:transparent;border:none;outline:none;color:#e5e5e5;font-family:'Inter',sans-serif;font-size:13px;padding:11px 14px 11px 8px}
#search::placeholder{color:rgba(255,255,255,.2)}
.search-results{position:fixed;top:52px;left:50%;transform:translateX(-50%);z-index:56;width:300px;background:rgba(14,14,14,.97);border:1px solid rgba(255,255,255,.08);border-radius:12px;max-height:260px;overflow-y:auto;display:none;backdrop-filter:blur(28px);box-shadow:0 12px 40px rgba(0,0,0,.5)}
.search-results.open{display:block}
.sr-item{padding:10px 16px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:background .08s;border-bottom:1px solid rgba(255,255,255,.03)}
.sr-item:last-child{border-bottom:none}
.sr-item:hover{background:rgba(201,168,76,.08)}
.sr-id{font-family:'Newsreader',serif;font-weight:600;font-size:14px;color:#e8cc6e}
.sr-block{font-size:10px;color:rgba(255,255,255,.3)}
.sr-badge{font-size:9px;font-weight:700;padding:2px 8px;border-radius:8px;text-transform:uppercase}
.sr-badge.available{background:rgba(34,197,94,.1);color:#22c55e}
.sr-badge.sold{background:rgba(239,68,68,.08);color:#ef4444}
.sr-badge.reserved{background:rgba(234,179,8,.08);color:#eab308}
.block-filters{position:fixed;top:62px;left:24px;z-index:50;display:flex;flex-wrap:wrap;gap:4px;max-width:420px}
.bf-btn{padding:4px 10px;border-radius:7px;border:1px solid rgba(255,255,255,.06);background:rgba(18,18,18,.85);color:rgba(255,255,255,.35);font-size:10px;font-weight:600;cursor:pointer;transition:all .12s;backdrop-filter:blur(12px);font-family:'Inter',sans-serif}
.bf-btn:hover{background:rgba(201,168,76,.1);color:#e8cc6e;border-color:rgba(201,168,76,.2)}
.bf-btn.on{background:rgba(201,168,76,.14);color:#e8cc6e;border-color:rgba(201,168,76,.25)}
.bf-cnt{font-size:7px;color:rgba(255,255,255,.2);margin-left:2px;font-weight:400}
.bf-rst{padding:4px 12px;border-radius:7px;border:1px solid rgba(201,168,76,.15);background:rgba(201,168,76,.08);color:#e8cc6e;font-size:10px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.stats{position:fixed;bottom:20px;left:20px;z-index:50;display:flex;gap:1px;background:rgba(18,18,18,.92);border:1px solid rgba(255,255,255,.07);border-radius:14px;overflow:hidden;backdrop-filter:blur(24px)}
.stat-item{padding:10px 18px;text-align:center;min-width:70px}
.stat-item+.stat-item{border-left:1px solid rgba(255,255,255,.04)}
.stat-num{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.stat-lbl{font-size:7px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,.25);margin-top:2px}
.ctrls{position:fixed;bottom:20px;right:20px;z-index:50;display:flex;flex-direction:column;gap:1px;background:rgba(18,18,18,.92);border:1px solid rgba(255,255,255,.07);border-radius:14px;overflow:hidden;backdrop-filter:blur(24px);box-shadow:0 8px 32px rgba(0,0,0,.3)}
.ctrl-btn{width:46px;height:46px;background:transparent;border:none;color:rgba(255,255,255,.45);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s}
.ctrl-btn:hover{background:rgba(255,255,255,.05);color:#fff}
.ctrl-btn:active{transform:scale(.93)}
.ctrl-btn+.ctrl-btn{border-top:1px solid rgba(255,255,255,.04)}
.ctrl-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.zoom-pct{position:fixed;bottom:22px;right:78px;z-index:50;background:rgba(18,18,18,.85);border:1px solid rgba(255,255,255,.05);border-radius:10px;padding:7px 13px;font-size:11px;font-weight:600;color:rgba(255,255,255,.28);font-variant-numeric:tabular-nums;backdrop-filter:blur(20px)}
#tip{position:fixed;z-index:200;pointer-events:none;opacity:0;transition:opacity .06s;background:rgba(14,14,14,.96);border:1px solid rgba(255,255,255,.09);border-radius:13px;padding:14px 18px;min-width:200px;box-shadow:0 16px 48px rgba(0,0,0,.5);backdrop-filter:blur(28px)}
#tip.on{opacity:1}
.tip-head{display:flex;align-items:center;justify-content:space-between;gap:14px}
.tip-id{font-family:'Newsreader',serif;font-size:17px;font-weight:600;color:#e8cc6e}
.tip-badge{font-size:9px;font-weight:700;letter-spacing:.5px;padding:3px 9px;border-radius:10px;text-transform:uppercase}
.tip-badge.available{background:rgba(34,197,94,.12);color:#22c55e}
.tip-badge.sold{background:rgba(239,68,68,.10);color:#ef4444}
.tip-badge.reserved{background:rgba(234,179,8,.10);color:#eab308}
.tip-meta{font-size:11px;color:rgba(255,255,255,.3);margin-top:5px}
#panel{position:fixed;top:0;right:0;bottom:0;width:395px;z-index:100;background:rgba(12,12,12,.98);border-left:1px solid rgba(255,255,255,.06);backdrop-filter:blur(40px);transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-24px 0 64px rgba(0,0,0,.5)}
#panel.open{transform:translateX(0)}
.panel-close{position:absolute;top:14px;right:14px;width:36px;height:36px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:10px;color:rgba(255,255,255,.35);font-size:16px;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center;transition:all .1s}
.panel-close:hover{background:rgba(255,255,255,.08);color:#fff}
.panel-hero{position:relative;padding:38px 28px 24px;background:radial-gradient(ellipse at 50% 0%,var(--hc,rgba(34,197,94,.15)) 0%,transparent 70%)}
.panel-hero .label{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,.3);font-weight:500}
.panel-hero .title{font-family:'Newsreader',serif;font-size:38px;font-weight:700;color:#e8cc6e;line-height:1.1;margin-top:4px}
.panel-hero .subtitle{font-size:11px;color:rgba(255,255,255,.25);margin-top:6px}
.panel-body{flex:1;overflow-y:auto;padding:0 24px 28px}
.panel-body::-webkit-scrollbar{width:3px}
.panel-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:4px}
.pd-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.pd-card{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.05);border-radius:10px;padding:14px 16px}
.pd-card.wide{grid-column:1/-1}
.pd-card .lbl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.25);margin-bottom:5px}
.pd-card .val{font-size:14px;font-weight:600;color:#e5e5e5}
.pd-card.price{background:linear-gradient(135deg,rgba(201,168,76,.08),rgba(201,168,76,.03));border-color:rgba(201,168,76,.12)}
.pd-card.price .val{font-family:'Newsreader',serif;font-size:26px;color:#e8cc6e}
.pd-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 14px;border-radius:10px;text-transform:uppercase;letter-spacing:.5px}
.pd-status.available{background:rgba(34,197,94,.1);color:#22c55e}
.pd-status.sold{background:rgba(239,68,68,.08);color:#ef4444}
.pd-status.reserved{background:rgba(234,179,8,.08);color:#eab308}
.pd-status .dot{width:8px;height:8px;border-radius:50%}
.pd-status.available .dot{background:#22c55e}
.pd-status.sold .dot{background:#ef4444}
.pd-status.reserved .dot{background:#eab308}
.enquire-btn{display:block;width:100%;margin-top:20px;padding:16px;border-radius:12px;border:none;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:all .15s}
.enquire-btn.active{background:linear-gradient(135deg,#c9a84c,#e8cc6e);color:#0a0a0a;box-shadow:0 4px 20px rgba(201,168,76,.3)}
.enquire-btn.active:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(201,168,76,.4)}
.enquire-btn.disabled{background:rgba(255,255,255,.04);color:rgba(255,255,255,.2);cursor:default}
.onboard{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:300;text-align:center;animation:fadeOnboard 5.5s ease forwards;pointer-events:none}
@keyframes fadeOnboard{0%{opacity:0;transform:translate(-50%,-50%) scale(.95)}8%{opacity:1;transform:translate(-50%,-50%) scale(1)}65%{opacity:1}100%{opacity:0}}
.onboard h2{font-family:'Newsreader',serif;font-size:28px;color:#e8cc6e;font-weight:600}
.onboard .plots{font-size:13px;color:rgba(255,255,255,.35);margin:6px 0 18px;letter-spacing:1px}
.onboard .hints{display:flex;gap:12px;justify-content:center}
.onboard .hint{background:rgba(18,18,18,.9);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:10px 18px;backdrop-filter:blur(20px)}
.onboard .hk{font-size:10px;font-weight:700;color:#c9a84c;letter-spacing:1px;text-transform:uppercase}
.onboard .hv{font-size:10px;color:rgba(255,255,255,.3);margin-top:2px}
@media(max-width:768px){
  #topbar{padding:10px 14px;flex-direction:column;gap:8px;align-items:flex-start}
  .legend{display:none}
  .search-wrap{width:calc(100% - 28px);top:auto;bottom:76px}
  .search-results{top:auto;bottom:112px;width:calc(100% - 28px)}
  .block-filters{top:58px;left:10px;max-width:calc(100% - 20px)}
  #panel{width:100%;height:75vh;top:auto;transform:translateY(100%);border-left:none;border-top:1px solid rgba(255,255,255,.06);border-radius:20px 20px 0 0}
  #panel.open{transform:translateY(0)}
  .stats{left:10px;bottom:10px}
  .ctrls{right:10px;bottom:10px}
  .zoom-pct{right:68px;bottom:12px}
}
</style>
</head>

function gc(p){ const t=p.t.toUpperCase(); return TC[t]||SC[p.s]||SC.available; }

// ═══ PAN & ZOOM ═══
const root=document.getElementById('map-root'), wrap=document.getElementById('wrap');
let scale=1,panX=0,panY=0,isDragging=false,dragMoved=false,dragStart={x:0,y:0};
let selIdx=-1,activeBlock=null,statusFilter='all';
const plotLayer=document.getElementById('plot-layer');
const blockLabels=document.getElementById('block-labels');

function applyTransform(){
  wrap.style.transform=`translate(${panX}px,${panY}px) scale(${scale})`;
  const pct=document.querySelector('.zoom-pct');
  if(pct) pct.textContent=Math.round(scale*100)+'%';
}
function zoomAt(cx,cy,factor){
  const ns=Math.max(.3,Math.min(25,scale*factor));
  panX=cx-(cx-panX)*(ns/scale);
  panY=cy-(cy-panY)*(ns/scale);
  scale=ns;
  applyTransform();
}
function fitView(){
  const vw=window.innerWidth,vh=window.innerHeight;
  scale=Math.min(vw/SVG_W,vh/SVG_H)*.95;
  panX=(vw-SVG_W*scale)/2;
  panY=(vh-SVG_H*scale)/2;
  applyTransform();
}

// Mouse wheel
root.addEventListener('wheel',e=>{
  e.preventDefault();
  zoomAt(e.clientX,e.clientY,e.deltaY<0?1.12:1/1.12);
},{passive:false});

// Mouse drag
root.addEventListener('mousedown',e=>{
  if(e.button!==0)return;
  isDragging=true;dragMoved=false;
  dragStart={x:e.clientX-panX,y:e.clientY-panY};
  root.classList.add('dragging');
});
window.addEventListener('mousemove',e=>{
  if(!isDragging)return;
  const dx=e.clientX-dragStart.x-panX,dy=e.clientY-dragStart.y-panY;
  if(Math.abs(dx)>3||Math.abs(dy)>3) dragMoved=true;
  panX=e.clientX-dragStart.x;
  panY=e.clientY-dragStart.y;
  applyTransform();
});
window.addEventListener('mouseup',()=>{
  isDragging=false;
  root.classList.remove('dragging');
});

// Touch
let lastTouchDist=0;
root.addEventListener('touchstart',e=>{
  if(e.touches.length===1){
    isDragging=true;dragMoved=false;
    dragStart={x:e.touches[0].clientX-panX,y:e.touches[0].clientY-panY};
  } else if(e.touches.length===2){
    lastTouchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  }
},{passive:false});
root.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1&&isDragging){
    const dx=e.touches[0].clientX-dragStart.x-panX;
    const dy=e.touches[0].clientY-dragStart.y-panY;
    if(Math.abs(dx)>3||Math.abs(dy)>3) dragMoved=true;
    panX=e.touches[0].clientX-dragStart.x;
    panY=e.touches[0].clientY-dragStart.y;
    applyTransform();
  } else if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(lastTouchDist>0){
      const cx=(e.touches[0].clientX+e.touches[1].clientX)/2;
      const cy=(e.touches[0].clientY+e.touches[1].clientY)/2;
      zoomAt(cx,cy,d/lastTouchDist);
    }
    lastTouchDist=d;
  }
},{passive:false});
root.addEventListener('touchend',()=>{ isDragging=false;lastTouchDist=0; });

// Double click
root.addEventListener('dblclick',e=>{ zoomAt(e.clientX,e.clientY,2.5); });

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  switch(e.key){
    case'+':case'=':zoomAt(window.innerWidth/2,window.innerHeight/2,1.3);break;
    case'-':zoomAt(window.innerWidth/2,window.innerHeight/2,1/1.3);break;
    case'0':fitView();break;
    case'Escape':closePanel();break;
    case'ArrowUp':panY+=60;applyTransform();break;
    case'ArrowDown':panY-=60;applyTransform();break;
    case'ArrowLeft':panX+=60;applyTransform();break;
    case'ArrowRight':panX-=60;applyTransform();break;
  }
});

// ═══ RENDER PLOTS ═══
function renderPlots(){
  PLOTS.forEach((p,i)=>{
    const poly=document.createElementNS('http://www.w3.org/2000/svg','polygon');
    poly.setAttribute('points',POLYS[i]);
    poly.setAttribute('data-idx',i);
    poly.classList.add('plot-poly');
    const c=gc(p);
    poly.setAttribute('fill',c.fill);
    poly.setAttribute('fill-opacity',c.fillOp);
    poly.setAttribute('stroke',c.stroke);
    poly.setAttribute('stroke-opacity',c.strokeOp);
    poly.setAttribute('stroke-width','0.5');
    // Hide if filtered
    if(activeBlock&&p.b!==activeBlock) poly.style.display='none';
    if(statusFilter!=='all'&&p.s!==statusFilter) poly.style.display='none';
    plotLayer.appendChild(poly);
  });
}

function renderBlockLabels(){
  Object.entries(BLOCKS).forEach(([id,b])=>{
    const txt=document.createElementNS('http://www.w3.org/2000/svg','text');
    txt.setAttribute('x',b.cx);
    txt.setAttribute('y',b.cy);
    txt.setAttribute('text-anchor','middle');
    txt.setAttribute('dominant-baseline','central');
    txt.classList.add('block-label');
    const fs=b.count>200?16:b.count>50?14:12;
    txt.setAttribute('font-size',fs);
    txt.textContent='Block '+id;
    blockLabels.appendChild(txt);
  });
}

// ═══ TOOLTIP ═══
const tip=document.getElementById('tip');
function showTip(e,p){
  tip.innerHTML=`<div class="tip-head"><span class="tip-id">${p.i}</span><span class="tip-badge ${p.s}">${p.s}</span></div><div class="tip-meta">${tn(p.t)} \u00b7 ${p.z}m\u00b2 \u00b7 Block ${p.b}</div>`;
  tip.classList.add('on');
  const x=Math.min(e.clientX+16,window.innerWidth-230);
  const y=Math.min(e.clientY+16,window.innerHeight-80);
  tip.style.left=x+'px';tip.style.top=y+'px';
}
function hideTip(){ tip.classList.remove('on'); }

// ═══ DETAIL PANEL ═══
const panel=document.getElementById('panel');
function openPanel(p){
  const hc=p.s==='available'?'rgba(34,197,94,.15)':p.s==='sold'?'rgba(239,68,68,.12)':'rgba(234,179,8,.12)';
  panel.innerHTML=`
    <button class="panel-close" onclick="closePanel()">\u2715</button>
    <div class="panel-hero" style="--hc:${hc}">
      <div class="label">Block ${p.b} \u00b7 ${tn(p.t)}</div>
      <div class="title">${p.i}</div>
      <div class="subtitle">${ESTATE_NAME} \u2014 ${ESTATE_LOC}</div>
    </div>
    <div class="panel-body">
      <div class="pd-status ${p.s}"><span class="dot"></span>${p.s}</div>
      <div class="pd-grid">
        <div class="pd-card"><div class="lbl">Type</div><div class="val">${tn(p.t)}</div></div>
        <div class="pd-card"><div class="lbl">Size</div><div class="val">${p.z} m\u00b2</div></div>
        <div class="pd-card"><div class="lbl">Block</div><div class="val">${p.b}</div></div>
        <div class="pd-card"><div class="lbl">Plot No.</div><div class="val">${p.n}</div></div>
        <div class="pd-card wide price"><div class="lbl">Price</div><div class="val">${fmt(p.p)}</div></div>
        <div class="pd-card"><div class="lbl">Estate</div><div class="val">${ESTATE_NAME}</div></div>
        <div class="pd-card"><div class="lbl">Area</div><div class="val">${ESTATE_LOC.split(',')[0]}</div></div>
      </div>
      <button class="enquire-btn ${p.s==='available'?'active':'disabled'}" ${p.s!=='available'?'disabled':''}>
        ${p.s==='available'?'Enquire Now':p.s==='sold'?'Sold':'Reserved'}
      </button>
    </div>`;
  panel.classList.add('open');
}
function closePanel(){
  panel.classList.remove('open');
  if(selIdx>=0){
    const prev=plotLayer.children[selIdx];
    if(prev) prev.classList.remove('selected');
    selIdx=-1;
  }
}

function selectPlot(idx){
  if(selIdx>=0){
    const prev=plotLayer.children[selIdx];
    if(prev) prev.classList.remove('selected');
  }
  selIdx=idx;
  const el=plotLayer.children[idx];
  if(el) el.classList.add('selected');
  openPanel(PLOTS[idx]);
  // Center on plot
  const p=PLOTS[idx];
  const cx=window.innerWidth/2, cy=window.innerHeight/2;
  if(scale<3){
    const ns=5;
    panX=cx-p.x*ns;
    panY=cy-p.y*ns;
    scale=ns;
  }
  applyTransform();
}

// Plot events
plotLayer.addEventListener('click',e=>{
  if(dragMoved) return;
  const el=e.target.closest('.plot-poly');
  if(!el) return;
  selectPlot(parseInt(el.dataset.idx));
});
plotLayer.addEventListener('mousemove',e=>{
  const el=e.target.closest('.plot-poly');
  if(el) showTip(e,PLOTS[parseInt(el.dataset.idx)]);
  else hideTip();
});
plotLayer.addEventListener('mouseleave',hideTip);

// Click empty space to close
root.addEventListener('click',e=>{
  if(dragMoved) return;
  if(!e.target.closest('.plot-poly')&&!e.target.closest('#panel')){
    closePanel();
  }
});

// ═══ UI RENDERING ═══
function renderUI(){
  const counts={available:0,sold:0,reserved:0};
  PLOTS.forEach(p=>counts[p.s]++);
  const total=PLOTS.length;

  // Top bar
  const topbar=document.createElement('div');
  topbar.id='topbar';
  topbar.innerHTML=`
    <div class="brand">
      <div class="brand-mark">${ESTATE_INITIALS}</div>
      <div><h1>${ESTATE_NAME}</h1><div class="sub">${ESTATE_LOC}</div></div>
    </div>
    <div class="legend" id="legend">
      <div class="leg-chip active" data-f="all"><div class="leg-dot" style="background:linear-gradient(135deg,#22c55e,#3b82f6)"></div>All<span class="leg-num">${total}</span></div>
      <div class="leg-chip" data-f="available"><div class="leg-dot" style="background:#22c55e"></div>Available<span class="leg-num">${counts.available}</span></div>
      <div class="leg-chip" data-f="sold"><div class="leg-dot" style="background:#ef4444"></div>Sold<span class="leg-num">${counts.sold}</span></div>
      <div class="leg-chip" data-f="reserved"><div class="leg-dot" style="background:#eab308"></div>Reserved<span class="leg-num">${counts.reserved}</span></div>
    </div>`;
  document.body.appendChild(topbar);

  // Legend filter
  document.getElementById('legend').addEventListener('click',e=>{
    const chip=e.target.closest('.leg-chip');
    if(!chip) return;
    statusFilter=chip.dataset.f;
    document.querySelectorAll('.leg-chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    // Re-filter
    Array.from(plotLayer.children).forEach((el,i)=>{
      const p=PLOTS[i];
      const blockOk=!activeBlock||p.b===activeBlock;
      const statusOk=statusFilter==='all'||p.s===statusFilter;
      el.style.display=(blockOk&&statusOk)?'':'none';
    });
  });

  // Search
  const sw=document.createElement('div');
  sw.className='search-wrap';
  sw.innerHTML=`<div class="search-icon"><svg><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div><input id="search" placeholder="Search plot e.g. ${Object.keys(BLOCKS)[0]}-1, ${Object.keys(BLOCKS)[0]}-25...">`;
  document.body.appendChild(sw);
  const sr=document.createElement('div');
  sr.className='search-results';sr.id='searchResults';
  document.body.appendChild(sr);

  document.getElementById('search').addEventListener('input',e=>{
    const q=e.target.value.toUpperCase().trim();
    if(!q){ sr.classList.remove('open');sr.innerHTML='';return; }
    const matches=PLOTS.map((p,i)=>({...p,idx:i})).filter(p=>p.i.toUpperCase().includes(q)).slice(0,10);
    if(!matches.length){ sr.classList.remove('open');sr.innerHTML='';return; }
    sr.innerHTML=matches.map(p=>`<div class="sr-item" data-idx="${p.idx}"><div><span class="sr-id">${p.i}</span><span class="sr-block"> Block ${p.b}</span></div><span class="sr-badge ${p.s}">${p.s}</span></div>`).join('');
    sr.classList.add('open');
  });
  sr.addEventListener('click',e=>{
    const item=e.target.closest('.sr-item');
    if(!item) return;
    selectPlot(parseInt(item.dataset.idx));
    sr.classList.remove('open');
    document.getElementById('search').value='';
  });

  // Block filters
  const bKeys=Object.keys(BLOCKS);
  if(bKeys.length>1){
    const bf=document.createElement('div');
    bf.className='block-filters';
    bf.innerHTML=`<button class="bf-rst" id="bfReset">All Blocks</button>`+bKeys.map(k=>`<button class="bf-btn" data-b="${k}">Block ${k}<span class="bf-cnt">${BLOCKS[k].count}</span></button>`).join('');
    document.body.appendChild(bf);

    bf.addEventListener('click',e=>{
      const btn=e.target.closest('.bf-btn');
      const rst=e.target.closest('.bf-rst');
      if(btn){
        const b=btn.dataset.b;
        activeBlock=activeBlock===b?null:b;
        document.querySelectorAll('.bf-btn').forEach(x=>x.classList.remove('on'));
        if(activeBlock) btn.classList.add('on');
        // Filter & zoom
        Array.from(plotLayer.children).forEach((el,i)=>{
          const p=PLOTS[i];
          const blockOk=!activeBlock||p.b===activeBlock;
          const statusOk=statusFilter==='all'||p.s===statusFilter;
          el.style.display=(blockOk&&statusOk)?'':'none';
        });
        if(activeBlock&&BLOCKS[activeBlock]){
          const bl=BLOCKS[activeBlock];
          const cx=window.innerWidth/2, cy=window.innerHeight/2;
          scale=6;
          panX=cx-bl.cx*scale;
          panY=cy-bl.cy*scale;
          applyTransform();
        }
      }
      if(rst){
        activeBlock=null;
        document.querySelectorAll('.bf-btn').forEach(x=>x.classList.remove('on'));
        Array.from(plotLayer.children).forEach((el,i)=>{
          const p=PLOTS[i];
          const statusOk=statusFilter==='all'||p.s===statusFilter;
          el.style.display=statusOk?'':'none';
        });
        fitView();
      }
    });
  }

  // Stats
  const stats=document.createElement('div');
  stats.className='stats';
  stats.innerHTML=`
    <div class="stat-item"><div class="stat-num" style="color:#22c55e">${counts.available}</div><div class="stat-lbl">Available</div></div>
    <div class="stat-item"><div class="stat-num" style="color:#ef4444">${counts.sold}</div><div class="stat-lbl">Sold</div></div>
    <div class="stat-item"><div class="stat-num" style="color:#eab308">${counts.reserved}</div><div class="stat-lbl">Reserved</div></div>
    <div class="stat-item"><div class="stat-num">${total}</div><div class="stat-lbl">Total</div></div>`;
  document.body.appendChild(stats);

  // Zoom controls
  const ctrls=document.createElement('div');
  ctrls.className='ctrls';
  ctrls.innerHTML=`
    <button class="ctrl-btn" id="zIn"><svg><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    <button class="ctrl-btn" id="zOut"><svg><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    <button class="ctrl-btn" id="zFit"><svg><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>`;
  document.body.appendChild(ctrls);
  document.getElementById('zIn').addEventListener('click',()=>zoomAt(window.innerWidth/2,window.innerHeight/2,1.4));
  document.getElementById('zOut').addEventListener('click',()=>zoomAt(window.innerWidth/2,window.innerHeight/2,1/1.4));
  document.getElementById('zFit').addEventListener('click',fitView);

  // Zoom percentage
  const zp=document.createElement('div');
  zp.className='zoom-pct';zp.textContent='100%';
  document.body.appendChild(zp);

  // Onboarding
  const ob=document.createElement('div');
  ob.className='onboard';
  ob.innerHTML=`<h2>${ESTATE_NAME}</h2><div class="plots">${total} Interactive Plots</div><div class="hints"><div class="hint"><div class="hk">Scroll</div><div class="hv">Zoom</div></div><div class="hint"><div class="hk">Drag</div><div class="hv">Pan</div></div><div class="hint"><div class="hk">Click</div><div class="hv">Select</div></div></div>`;
  document.body.appendChild(ob);
}

// ═══ INIT ═══
renderPlots();
renderBlockLabels();
renderUI();
fitView();
</script>
</body>
</html>
