const TC={CR:{fill:'#3b82f6',fo:.55,stroke:'#1d4ed8',so:.7},C:{fill:'#8b5cf6',fo:.55,stroke:'#6d28d9',so:.7},IN:{fill:'#f97316',fo:.55,stroke:'#c2410c',so:.7},UT:{fill:'#a78bfa',fo:.45,stroke:'#7c3aed',so:.6},OS:{fill:'#34d399',fo:.45,stroke:'#059669',so:.6},P:{fill:'#f472b6',fo:.45,stroke:'#be185d',so:.6},SP:{fill:'#fbbf24',fo:.55,stroke:'#b45309',so:.7},SS:{fill:'#fbbf24',fo:.55,stroke:'#b45309',so:.7},CS:{fill:'#3b82f6',fo:.55,stroke:'#1d4ed8',so:.7},PS:{fill:'#f97316',fo:.55,stroke:'#c2410c',so:.7}};
function gc(p){const t=p.t.toUpperCase();return TC[t]||SC[p.s]||SC.available}const plotLayer=document.getElementById('plot-layer'),plotEls=[];
function renderPlots(){const f=document.createDocumentFragment(),ns='http://www.w3.org/2000/svg';for(let i=0;i<PLOTS.length;i++){const p=PLOTS[i],pts=POLYS[i];if(!pts)continue;const c=gc(p),poly=document.createElementNS(ns,'polygon');poly.setAttribute('points',pts);poly.setAttribute('fill',c.fill);poly.setAttribute('fill-opacity',c.fo);poly.setAttribute('stroke',c.stroke);poly.setAttribute('stroke-width','0.5');poly.setAttribute('stroke-opacity',c.so);poly.dataset.idx=i;poly.classList.add('plot-poly');poly.style.vectorEffect='non-scaling-stroke';f.appendChild(poly);plotEls[i]=poly}plotLayer.appendChild(f)}
function renderBlockLabels(){const ns='http://www.w3.org/2000/svg',g=document.getElementById('block-labels');for(const[b,info]of Object.entries(BLOCKS)){const t=document.createElementNS(ns,'text');t.setAttribute('x',info.cx);t.setAttribute('y',info.cy-10);t.setAttribute('font-size','14');t.setAttribute('text-anchor','middle');t.classList.add('block-label');t.textContent='Block '+b;g.appendChild(t)}}
function computeStats(){let a=0,s=0,r=0;PLOTS.forEach(p=>{if(p.s==='available')a++;else if(p.s==='sold')s++;else r++});return{a,s,r,t:PLOTS.length}}
function renderUI(){const st=computeStats();document.getElementById('legend').innerHTML=`<div class="leg-chip active" data-filter="all"><div class="leg-dot" style="background:#fff"></div>All<span class="leg-num">${st.t.toLocaleString()}</span></div><div class="leg-chip" data-filter="available"><div class="leg-dot" style="background:#22c55e"></div>Available<span class="leg-num">${st.a.toLocaleString()}</span></div><div class="leg-chip" data-filter="sold"><div class="leg-dot" style="background:#ef4444"></div>Sold<span class="leg-num">${st.s.toLocaleString()}</span></div><div class="leg-chip" data-filter="reserved"><div class="leg-dot" style="background:#eab308"></div>Reserved<span class="leg-num">${st.r.toLocaleString()}</span></div>`;document.getElementById('stats-bar').innerHTML=`<div class="stat-item"><div class="stat-num" style="color:#22c55e">${st.a.toLocaleString()}</div><div class="stat-lbl">Available</div></div><div class="stat-item"><div class="stat-num" style="color:#ef4444">${st.s.toLocaleString()}</div><div class="stat-lbl">Sold</div></div><div class="stat-item"><div class="stat-num" style="color:#eab308">${st.r.toLocaleString()}</div><div class="stat-lbl">Reserved</div></div><div class="stat-item"><div class="stat-num">${st.t.toLocaleString()}</div><div class="stat-lbl">Total</div></div>`;const sb=Object.entries(BLOCKS).sort((a,b)=>a[0].localeCompare(b[0]));let bf='<button class="bf-rst" onclick="resetFilter()">All</button>';sb.forEach(([b,i])=>bf+=`<button class="bf-btn" data-block="${b}">${b}<span class="bf-cnt">${i.count}</span></button>`);document.getElementById('block-filters').innerHTML=bf}
function applyTransform(){wrap.style.transform=`translate(${panX}px,${panY}px) scale(${scale})`;document.getElementById('zoom-pct').textContent=Math.round(scale*100)+'%'}
function fitView(){const vw=window.innerWidth,vh=window.innerHeight,sx=vw/SVG_W,sy=vh/SVG_H;scale=Math.min(sx,sy)*.95;panX=(vw-SVG_W*scale)/2;panY=(vh-SVG_H*scale)/2;applyTransform()}
function zoomAt(cx,cy,f){const ns=Math.max(.3,Math.min(scale*f,25)),r=ns/scale;panX=cx-(cx-panX)*r;panY=cy-(cy-panY)*r;scale=ns;applyTransform()}
mapRoot.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.12:1/1.12)},{passive:!1});
mapRoot.addEventListener('mousedown',e=>{if(e.button!==0)return;isDragging=!0;dragMoved=!1;dragStart={x:e.clientX-panX,y:e.clientY-panY};mapRoot.classList.add('dragging')});window.addEventListener('mousemove',e=>{if(!isDragging)return;if(Math.abs(e.clientX-dragStart.x-panX)>3||Math.abs(e.clientY-dragStart.y-panY)>3)dragMoved=!0;panX=e.clientX-dragStart.x;panY=e.clientY-dragStart.y;applyTransform()});window.addEventListener('mouseup',()=>{isDragging=!1;mapRoot.classList.remove('dragging')});
mapRoot.addEventListener('dblclick',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,2.5)});
mapRoot.addEventListener('touchstart',e=>{if(e.touches.length===1){isDragging=!0;dragMoved=!1;dragStart={x:e.touches[0].clientX-panX,y:e.touches[0].clientY-panY}}},{passive:!0});mapRoot.addEventListener('touchmove',e=>{if(e.touches.length===1&&isDragging){if(Math.abs(e.touches[0].clientX-dragStart.x-panX)>3)dragMoved=!0;panX=e.touches[0].clientX-dragStart.x;panY=e.touches[0].clientY-dragStart.y;applyTransform()}},{passive:!0});mapRoot.addEventListener('touchend',()=>{isDragging=!1});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;switch(e.key){case'+':case'=':zoomAt(innerWidth/2,innerHeight/2,1.3);break;case'-':zoomAt(innerWidth/2,innerHeight/2,1/1.3);break;case'0':fitView();break;case'Escape':closePanel();break;case'ArrowLeft':panX+=60;applyTransform();break;case'ArrowRight':panX-=60;applyTransform();break;case'ArrowUp':panY+=60;applyTransform();break;case'ArrowDown':panY-=60;applyTransform();break}});
document.getElementById('z-in').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1.5);document.getElementById('z-out').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1/1.5);document.getElementById('z-fit').onclick=fitView;
const tip=document.getElementById('tip'),panel=document.getElementById('panel');
function fmt(p){return'\u20A6'+p.toLocaleString()}const TN={residential:'Residential',CR:'Commercial/Residential',C:'Commercial',IN:'Industrial',UT:'Utility',OS:'Open Space',P:'Public Use',SP:'Special',SS:'Smart School',CS:'Commercial/Special',PS:'Petrol Station'};
function tn(t){return TN[t]||t}
plotLayer.addEventListener('mousemove',e=>{const poly=e.target.closest('.plot-poly');if(!poly){tip.classList.remove('on');return}const i=+poly.dataset.idx,p=PLOTS[i];document.getElementById('tip-id').textContent=p.i;const b=document.getElementById('tip-badge');b.textContent=p.s;b.className='tip-badge '+p.s;document.getElementById('tip-meta').textContent=tn(p.t)+' · '+p.z+' sqm · Block '+p.b;tip.classList.add('on');tip.style.left=Math.min(e.clientX+16,innerWidth-230)+'px';tip.style.top=Math.min(e.clientY+16,innerHeight-80)+'px'});plotLayer.addEventListener('mouseleave',()=>tip.classList.remove('on'));
plotLayer.addEventListener('click',e=>{if(dragMoved)return;const poly=e.target.closest('.plot-poly');if(!poly)return;selectPlot(+poly.dataset.idx)});mapRoot.addEventListener('click',e=>{if(dragMoved)return;if(e.target===mapRoot||e.target===wrap)closePanel()});
function selectPlot(i){if(selectedPlot!==null&&plotEls[selectedPlot])plotEls[selectedPlot].classList.remove('selected');selectedPlot=i;plotEls[i].classList.add('selected');showPanel(i)}
function showPanel(i){const p=PLOTS[i],hc=p.s==='available'?'#22c55e':p.s==='sold'?'#ef4444':'#eab308';document.getElementById('panel-hero').style.setProperty('--hc',hc);document.getElementById('p-label').textContent='Block '+p.b+' · '+tn(p.t);document.getElementById('p-title').textContent='Plot '+p.i;document.getElementById('p-sub').textContent=ESTATE_NAME+', '+ESTATE_LOC;document.getElementById('panel-body').innerHTML=`<div class="sect"><div class="sect-label">Plot Details</div><div class="card-grid"><div class="card"><div class="c-label">Status</div><div class="c-value"><span class="status-badge ${p.s}">${p.s}</span></div></div><div class="card"><div class="c-label">Type</div><div class="c-value">${tn(p.t)}</div></div><div class="card"><div class="c-label">Size</div><div class="c-value">${p.z} sqm</div></div><div class="card"><div class="c-label">Block</div><div class="c-value">${p.b}</div></div><div class="card price-card"><div class="c-label">Price</div><div class="c-value">${fmt(p.p)}</div></div></div></div><div class="sect"><div class="sect-label">Location</div><div class="card-grid"><div class="card"><div class="c-label">Estate</div><div class="c-value">${ESTATE_NAME}</div></div><div class="card"><div class="c-label">Area</div><div class="c-value">${ESTATE_LOC}</div></div></div></div>`;const old=document.querySelector('.enquire-btn');if(old)old.remove();const btn=document.createElement('button');btn.className=p.s==='available'?'enquire-btn active':'enquire-btn disabled';btn.textContent=p.s==='available'?'\u2709 Enquire About This Plot':p.s==='sold'?'Sold':'Reserved';panel.appendChild(btn);panel.classList.add('open')}
function closePanel(){panel.classList.remove('open');if(selectedPlot!==null&&plotEls[selectedPlot])plotEls[selectedPlot].classList.remove('selected');selectedPlot=null}
document.getElementById('panel-close').onclick=closePanel;
const searchInput=document.getElementById('search'),searchRes=document.getElementById('search-results');searchInput.addEventListener('input',()=>{const q=searchInput.value.trim().toUpperCase();if(q.length<1){searchRes.classList.remove('open');return}const m=PLOTS.filter(p=>p.i.toUpperCase().includes(q)).slice(0,10);searchRes.innerHTML=m.length?m.map(p=>`<div class="sr-item" data-idx="${PLOTS.indexOf(p)}"><div><span class="sr-id">${p.i}</span></div><span class="sr-badge ${p.s}">${p.s}</span></div>`).join(''):'<div style="padding:16px;text-align:center;font-size:12px;color:rgba(255,255,255,.2)">No plots found</div>';searchRes.classList.add('open')});searchRes.addEventListener('click',e=>{const it=e.target.closest('.sr-item');if(!it)return;const i=+it.dataset.idx;selectPlot(i);const p=PLOTS[i];panX=innerWidth/2-p.x*scale;panY=innerHeight/2-p.y*scale;if(scale<3)scale=5;applyTransform();searchRes.classList.remove('open');searchInput.value=p.i});searchInput.addEventListener('blur',()=>setTimeout(()=>searchRes.classList.remove('open'),200));
document.getElementById('block-filters').addEventListener('click',e=>{const btn=e.target.closest('.bf-btn');if(!btn)return;const b=btn.dataset.block;if(activeBlock===b){resetFilter();return}activeBlock=b;document.querySelectorAll('.bf-btn').forEach(x=>x.classList.toggle('on',x.dataset.block===b));PLOTS.forEach((p,i)=>{if(plotEls[i])plotEls[i].style.display=p.b===b?'':'none'});const bi=BLOCKS[b];if(bi){scale=4;panX=innerWidth/2-bi.cx*scale;panY=innerHeight/2-bi.cy*scale;applyTransform()}});
function resetFilter(){activeBlock=null;document.querySelectorAll('.bf-btn').forEach(b=>b.classList.remove('on'));PLOTS.forEach((p,i)=>{if(plotEls[i])plotEls[i].style.display=''});fitView()}
document.getElementById('legend').addEventListener('click',e=>{const c=e.target.closest('.leg-chip');if(!c)return;const f=c.dataset.filter;document.querySelectorAll('.leg-chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');if(f==='all')PLOTS.forEach((p,i)=>{if(plotEls[i])plotEls[i].style.display=''});else PLOTS.forEach((p,i)=>{if(plotEls[i])plotEls[i].style.display=p.s===f?'':'none'})});
renderPlots();renderBlockLabels();renderUI();fitView();
</script></body></html>
